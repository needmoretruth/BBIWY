# Builds the launcher from a release's tag and attaches it to that release, so
# that what is downloaded is what the tagged source builds — on a clean runner,
# with a pinned toolchain, from the lock file.
#
# Runs when a release is published, or by hand for a release that already
# exists (Actions → release → Run workflow, with its tag).
name: release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build, e.g. v0.1.0-alpha.1"
        required: true

permissions:
  contents: write

jobs:
  launcher:
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false

      # Static, against musl: one file that runs on any x86_64 Linux,
      # whatever its C library.
      - name: Build
        run: |
          rustup toolchain install 1.92.0 --profile minimal --target x86_64-unknown-linux-musl
          cd launcher
          cargo +1.92.0 build --release --locked --target x86_64-unknown-linux-musl

      - name: Checksum
        run: |
          name="bbiwy-${TAG#v}-x86_64-linux"
          mkdir dist
          cp launcher/target/x86_64-unknown-linux-musl/release/bbiwy "dist/$name"
          cd dist
          sha256sum "$name" > SHA256SUMS
          cat SHA256SUMS

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
