[package]
name = "bbiwy"
version = "0.0.1"
edition = "2021"
rust-version = "1.75"
license = "MPL-2.0"
description = "BBIWY launcher — seals each browser profile in its own network namespace"

# No dependencies. All this program does is compose three already-audited
# tools in a fixed order, so there is nothing to pull in — and that keeps the
# surface anyone has to audit as small as the source file itself.
[dependencies]

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
strip = true
